<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPTALEADS - Lead Hunting Simplificado</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; color: #333; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
    .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2 { color: #667eea; margin-bottom: 15px; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input, select { padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 1em; font-family: inherit; }
    button { padding: 12px 30px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1em; }
    button:hover { background: #764ba2; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    table th { background: #667eea; color: white; padding: 12px; text-align: left; }
    table td { padding: 12px; border-bottom: 1px solid #ddd; }
    table tr:hover { background: #f5f5f5; }
    .badge { display: inline-block; background: #d4edda; color: #155724; padding: 6px 12px; border-radius: 20px; font-weight: bold; }
    .message { padding: 15px; border-radius: 5px; margin-bottom: 20px; font-weight: bold; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
  </style>
</head>
<body>

<div class="container">
  <h1>🚀 CAPTALEADS - Busca de Leads (Simplificado)</h1>

  <div class="card">
    <h2>🔍 Busca de Leads</h2>
    <form id="search-leads-form">
      <input type="text" id="search-keywords" placeholder="Digite palavras-chave (ex: dentista, marketing)" required>
      <input type="text" id="search-location" placeholder="Localização (ex: São Paulo)" value="São Paulo">
      <select id="search-type"><option value="business">Negócio</option><option value="any">Qualquer</option></select>
      <button type="submit">🔍 Buscar Leads</button>
    </form>
  </div>

  <div id="search-results"></div>
</div>

<script>
  function generateMockLeads(keywords) {
    const firstNames = ["Carlos", "Maria", "João", "Ana", "Pedro", "Paula", "Lucas", "Juliana"];
    const lastNames = ["Silva", "Santos", "Oliveira", "Sousa", "Costa", "Mendes", "Gomes", "Martins"];
    const domains = ["gmail.com", "hotmail.com", "empresa.com.br"];

    const count = Math.floor(Math.random() * 8) + 5;
    const leads = [];

    for (let i = 0; i < count; i++) {
      const first = firstNames[Math.floor(Math.random() * firstNames.length)];
      const last = lastNames[Math.floor(Math.random() * lastNames.length)];
      const domain = domains[Math.floor(Math.random() * domains.length)];

      leads.push({
        name: `${first} ${last}`,
        email: `${first.toLowerCase()}.${last.toLowerCase()}@${domain}`,
        website: `https://${last.toLowerCase()}.com.br`,
        score: Math.floor(Math.random() * 40) + 60
      });
    }
    return leads;
  }

  function renderResults(leads) {
    const container = document.getElementById("search-results");
    if (!leads || leads.length === 0) {
      container.innerHTML = '<div class="message info">Nenhum resultado</div>';
      return;
    }

    const rows = leads.map(l => `
      <tr>
        <td>${l.name}</td>
        <td>${l.email}</td>
        <td><a href="${l.website}" target="_blank">Visitar</a></td>
        <td><span class="badge">${l.score}</span></td>
      </tr>
    `).join("");

    container.innerHTML = `
      <div class="message success">✅ ${leads.length} leads encontrados!</div>
      <div class="card">
        <h2>Resultados</h2>
        <table>
          <thead><tr><th>Nome</th><th>Email</th><th>Website</th><th>Score</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  document.getElementById("search-leads-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const keywords = document.getElementById("search-keywords").value;
    const container = document.getElementById("search-results");

    if (!keywords.trim()) {
      container.innerHTML = '<div class="message error">Digite uma palavra-chave!</div>';
      return;
    }

    container.innerHTML = '<div class="message info">🔍 Buscando...</div>';

    try {
      await new Promise(resolve => setTimeout(resolve, 1500));
      const leads = generateMockLeads(keywords);
      renderResults(leads);
    } catch (error) {
      container.innerHTML = `<div class="message error">Erro: ${error.message}</div>`;
    }
  });
</script>

</body>
</html>
