<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPTA LEADS - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 20px;
      padding: 60px 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }

    .logo { font-size: 3em; margin-bottom: 10px; }
    h1 { color: #333; margin-bottom: 10px; font-size: 2em; }
    .subtitle { color: #999; margin-bottom: 40px; }

    .form-group { margin: 20px 0; text-align: left; }
    label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1em; }
    input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: transform 0.3s;
    }
    .btn-login:hover { transform: scale(1.02); }

    .demo-info {
      background: #f0f0f0;
      padding: 20px;
      border-radius: 10px;
      margin-top: 30px;
      text-align: left;
      color: #666;
    }

    .demo-info h3 { color: #333; margin-bottom: 10px; }
    .demo-info p { margin: 5px 0; font-size: 0.9em; }

    .error { color: #c62828; margin-top: 10px; }
    .success { color: #2e7d32; margin-top: 10px; }
  </style>
</head>
<body>

<div class="login-container">
  <div class="logo">🚀</div>
  <h1>CAPTA LEADS</h1>
  <p class="subtitle">Acesse sua conta</p>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="seu@email.com" required>
    </div>

    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn-login">Entrar</button>
    <div id="message"></div>
  </form>

  <div class="demo-info">
    <h3>🧪 Modo Demonstração</h3>
    <p><strong>Email:</strong> demo@captaleads.com</p>
    <p><strong>Senha:</strong> demo123</p>
    <p style="margin-top: 10px; font-size: 0.85em; color: #999;">Ou use qualquer email/senha para criar uma nova conta</p>
  </div>
</div>

<script>
function handleLogin(event) {
  event.preventDefault();

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const messageDiv = document.getElementById('message');

  // Simular autenticação (em produção, faria chamada real)
  if (email && password) {
    messageDiv.innerHTML = '<p class="success">✅ Autenticado! Entrando...</p>';

    // Salvar email na sessão
    sessionStorage.setItem('user_email', email);

    // Redirecionar após 1s
    setTimeout(() => {
      window.location.href = '/console.html';
    }, 1000);
  } else {
    messageDiv.innerHTML = '<p class="error">❌ Preencha todos os campos</p>';
  }
}

// Auto-preenchimento para demo
window.addEventListener('load', () => {
  // Verificar se já está autenticado
  const userEmail = sessionStorage.getItem('user_email');
  if (userEmail) {
    // Se já está autenticado, ir direto para console
    window.location.href = '/console.html';
  }
});
</script>

</body>
</html>
