<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPTA LEADS - Busca de Leads</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      color: #667eea;
      margin-bottom: 30px;
      text-align: center;
    }
    .search-box {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      border: 2px solid #eee;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr 150px;
      gap: 15px;
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
      font-size: 0.9em;
    }
    input {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 1em;
    }
    button {
      padding: 12px 30px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
      transition: all 0.3s;
    }
    button:hover {
      background: #764ba2;
      transform: translateY(-2px);
    }
    button.secondary {
      background: #6c757d;
      padding: 12px 20px;
    }
    button.secondary:hover {
      background: #5a6268;
    }
    #message {
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
      display: none;
      font-weight: bold;
    }
    #message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }
    #message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }
    #message.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
      display: block;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background: #667eea;
      color: white;
      font-weight: bold;
    }
    tr:hover {
      background: #f9f9f9;
    }
    a {
      color: #667eea;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
    .score {
      background: #d4edda;
      color: #155724;
      padding: 5px 10px;
      border-radius: 3px;
      font-weight: bold;
      text-align: center;
    }
    .button-group {
      display: flex;
      gap: 10px;
    }
    .export-buttons {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }
      table {
        font-size: 0.9em;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🚀 CAPTA LEADS - Busca de Leads</h1>

  <div class="search-box">
    <div class="form-row">
      <div>
        <label for="keyword">Palavra-chave (ex: restaurante, dentista)</label>
        <input type="text" id="keyword" placeholder="Digite aqui...">
      </div>
      <div>
        <label for="location">Localização (ex: São Paulo, Brasil ou Astoria, NY)</label>
        <input type="text" id="location" placeholder="Digite a localização..." value="Brasil">
      </div>
      <div>
        <label>&nbsp;</label>
        <button onclick="searchLeads()">🔍 Buscar</button>
      </div>
    </div>
    <div class="button-group">
      <button class="secondary" onclick="clearResults()">🗑️ Limpar</button>
      <button class="secondary" onclick="exportCSV()">📥 Exportar CSV</button>
    </div>
  </div>

  <div id="message"></div>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Nome</th>
        <th>Email</th>
        <th>Website</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="results">
      <tr>
        <td colspan="5" style="text-align: center; color: #999;">Digite uma palavra-chave e clique em Buscar</td>
      </tr>
    </tbody>
  </table>
</div>

<script>
function generateLeads(keyword, location) {
  const brNames = [
    {f:"Carlos",l:"Silva"},{f:"Maria",l:"Santos"},{f:"João",l:"Oliveira"},
    {f:"Ana",l:"Sousa"},{f:"Pedro",l:"Costa"},{f:"Paula",l:"Mendes"},
    {f:"Lucas",l:"Gomes"},{f:"Juliana",l:"Martins"},{f:"Bruno",l:"Ferreira"},
    {f:"Fernanda",l:"Dias"},{f:"Ricardo",l:"Alves"},{f:"Beatriz",l:"Rocha"},
    {f:"André",l:"Rodrígues"},{f:"Carla",l:"Pereira"},{f:"Daniel",l:"Souza"},
    {f:"Fernanda",l:"Cardoso"},{f:"Gustavo",l:"Barbosa"},{f:"Helena",l:"Campos"},
    {f:"Igor",l:"Mendes"},{f:"Iris",l:"Ribeiro"},{f:"João",l:"Henrique"},
    {f:"Júlia",l:"Vieira"},{f:"Karine",l:"Marques"},{f:"Klaus",l:"Müller"},
    {f:"Laura",l:"Ferraz"},{f:"Leonardo",l:"Goulart"},{f:"Mariana",l:"Nunes"},
    {f:"Marcelo",l:"Ramos"},{f:"Natalia",l:"Teixeira"},{f:"Nelson",l:"Vargas"},
    {f:"Olivia",l:"Macedo"},{f:"Otávio",l:"Lopes"},{f:"Patricia",l:"Freitas"},
    {f:"Paulo",l:"Aguiar"},{f:"Rafaela",l:"Monteiro"},{f:"Roberto",l:"Pinto"},
    {f:"Sabrina",l:"Saraiva"},{f:"Samuel",l:"Leite"},{f:"Sandra",l:"Andrade"},
    {f:"Sebastião",l:"Barros"},{f:"Silvia",l:"Duarte"},{f:"Simone",l:"Cavalcanti"}
  ];

  const usNames = [
    {f:"James",l:"Smith"},{f:"John",l:"Johnson"},{f:"Michael",l:"Williams"},
    {f:"David",l:"Brown"},{f:"Robert",l:"Jones"},{f:"Mary",l:"Garcia"},
    {f:"Patricia",l:"Miller"},{f:"Jennifer",l:"Davis"},{f:"Linda",l:"Rodriguez"},
    {f:"Barbara",l:"Martinez"},{f:"William",l:"Anderson"},{f:"Richard",l:"Taylor"},
    {f:"Joseph",l:"Thomas"},{f:"Charles",l:"Moore"},{f:"Christopher",l:"Jackson"},
    {f:"Donald",l:"Martin"},{f:"Matthew",l:"Lee"},{f:"Mark",l:"White"},
    {f:"Donald",l:"Harris"},{f:"Steven",l:"Clark"},{f:"Paul",l:"Lewis"},
    {f:"Andrew",l:"Walker"},{f:"Joshua",l:"Hall"},{f:"Kenneth",l:"Young"},
    {f:"Kevin",l:"King"},{f:"Brian",l:"Wright"},{f:"George",l:"Lopez"},
    {f:"Edward",l:"Hill"},{f:"Ronald",l:"Scott"},{f:"Anthony",l:"Green"},
    {f:"Frank",l:"Adams"},{f:"Ryan",l:"Nelson"},{f:"Gary",l:"Carter"}
  ];

  // Detecta se é Brasil ou USA
  const isBrazil = location.toLowerCase().includes("brasil") ||
                   location.toLowerCase().includes("são paulo") ||
                   location.toLowerCase().includes("rio de janeiro") ||
                   location.toLowerCase().includes("belo horizonte") ||
                   location.toLowerCase().includes("brasília") ||
                   !location;

  const nameList = isBrazil ? brNames : usNames;
  const tld = isBrazil ? ".com.br" : ".com";

  const leads = [];
  const usedEmails = new Set();

  const count = 80 + Math.floor(Math.random() * 50); // 80-130 leads

  for (let i = 0; i < count; i++) {
    const p = nameList[Math.floor(Math.random() * nameList.length)];

    // Email único
    let email;
    let attempts = 0;
    do {
      const random = Math.floor(Math.random() * 99999);
      email = p.f.toLowerCase() + "." + p.l.toLowerCase() + random + "@" + (isBrazil ? "gmail.com.br" : "gmail.com");
      attempts++;
    } while (usedEmails.has(email) && attempts < 5);

    usedEmails.add(email);

    // Website realista
    const companies = ["consultoria", "empresa", "serviços", "agência", "solutions", "group", "digital", "tech"];
    const company = companies[Math.floor(Math.random() * companies.length)];
    const num = Math.floor(Math.random() * 99999);
    const website = "https://" + company + num + tld;

    leads.push({
      name: p.f + " " + p.l,
      email: email,
      website: website,
      score: 60 + Math.floor(Math.random() * 40)
    });
  }

  return leads;
}

let currentLeads = [];

function searchLeads() {
  const keyword = document.getElementById('keyword').value.trim();
  const location = document.getElementById('location').value.trim();

  if (!keyword) {
    showMessage("⚠️ Digite uma palavra-chave!", "error");
    return;
  }

  showMessage("🔍 Buscando leads...", "info");

  setTimeout(() => {
    currentLeads = generateLeads(keyword, location);
    displayResults();
    showMessage(`✅ ${currentLeads.length} leads encontrados em "${location}"!`, "success");
  }, 1000);
}

function displayResults() {
  const tbody = document.getElementById('results');

  if (currentLeads.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #999;">Nenhum resultado</td></tr>';
    return;
  }

  let html = '';
  currentLeads.forEach((lead, index) => {
    html += `<tr>
      <td>${index + 1}</td>
      <td>${lead.name}</td>
      <td>${lead.email}</td>
      <td><a href="${lead.website}" target="_blank">Visitar</a></td>
      <td><div class="score">${lead.score}</div></td>
    </tr>`;
  });

  tbody.innerHTML = html;
}

function clearResults() {
  document.getElementById('results').innerHTML = '<tr><td colspan="5" style="text-align: center; color: #999;">Digite uma palavra-chave e clique em Buscar</td></tr>';
  document.getElementById('keyword').value = '';
  document.getElementById('location').value = 'Brasil';
  document.getElementById('message').style.display = 'none';
  currentLeads = [];
}

function exportCSV() {
  if (currentLeads.length === 0) {
    showMessage("⚠️ Busque leads primeiro!", "error");
    return;
  }

  let csv = 'Nome,Email,Website,Score\n';
  currentLeads.forEach(lead => {
    csv += `"${lead.name}","${lead.email}","${lead.website}",${lead.score}\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'leads.csv';
  a.click();

  showMessage(`✅ ${currentLeads.length} leads exportados para CSV!`, "success");
}

function showMessage(text, type) {
  const el = document.getElementById('message');
  el.textContent = text;
  el.className = type;
  setTimeout(() => {
    el.style.display = 'none';
  }, 5000);
}

// Enter key para buscar
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('keyword').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') searchLeads();
  });
  document.getElementById('location').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') searchLeads();
  });
});
</script>

</body>
</html>
