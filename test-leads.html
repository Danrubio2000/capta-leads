<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste - Lead Hunter</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    input, button { padding: 10px; width: 100%; margin: 10px 0; font-size: 1em; }
    button { background: #667eea; color: white; border: none; cursor: pointer; border-radius: 5px; }
    button:hover { background: #764ba2; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
    th { background: #667eea; color: white; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>

<div class="container">
  <h1>🔍 Teste - Busca de Leads</h1>

  <form id="testForm">
    <input type="text" id="keywords" placeholder="Digite uma palavra-chave" value="marketing" required>
    <button type="submit">Buscar</button>
  </form>

  <div id="message"></div>
  <div id="results"></div>
</div>

<script>
  // Função para gerar leads mocados
  function generateLeads(keyword) {
    console.log("Gerando leads para:", keyword);

    const firstNames = ["Carlos", "Maria", "João", "Ana", "Pedro", "Paula"];
    const lastNames = ["Silva", "Santos", "Oliveira", "Sousa", "Costa", "Mendes"];
    const domains = ["gmail.com", "hotmail.com", "empresa.com.br"];

    const count = Math.floor(Math.random() * 5) + 3;
    const leads = [];

    for (let i = 0; i < count; i++) {
      const first = firstNames[Math.floor(Math.random() * firstNames.length)];
      const last = lastNames[Math.floor(Math.random() * lastNames.length)];
      const domain = domains[Math.floor(Math.random() * domains.length)];

      leads.push({
        name: `${first} ${last}`,
        email: `${first.toLowerCase()}.${last.toLowerCase()}@${domain}`,
        website: `https://${last.toLowerCase()}.com.br`,
        score: Math.floor(Math.random() * 40) + 60
      });
    }

    return leads;
  }

  // Event listener do formulário
  document.getElementById("testForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    console.log("✅ Form submit disparado!");

    const keyword = document.getElementById("keywords").value;
    const messageDiv = document.getElementById("message");
    const resultsDiv = document.getElementById("results");

    if (!keyword) {
      messageDiv.innerHTML = '<p class="error">❌ Digite uma palavra-chave!</p>';
      return;
    }

    messageDiv.innerHTML = '<p>🔍 Buscando...</p>';
    resultsDiv.innerHTML = '';

    try {
      // Simula delay
      await new Promise(resolve => setTimeout(resolve, 1000));

      // Gera leads
      const leads = generateLeads(keyword);
      console.log("Leads gerados:", leads);

      if (leads.length === 0) {
        messageDiv.innerHTML = '<p class="error">❌ Nenhum lead encontrado</p>';
        return;
      }

      // Renderiza tabela
      let html = `
        <p class="success">✅ ${leads.length} leads encontrados!</p>
        <table>
          <thead>
            <tr><th>Nome</th><th>Email</th><th>Website</th><th>Score</th></tr>
          </thead>
          <tbody>
      `;

      leads.forEach(lead => {
        html += `
          <tr>
            <td>${lead.name}</td>
            <td>${lead.email}</td>
            <td><a href="${lead.website}" target="_blank">Visitar</a></td>
            <td>${lead.score}</td>
          </tr>
        `;
      });

      html += `
          </tbody>
        </table>
      `;

      messageDiv.innerHTML = '';
      resultsDiv.innerHTML = html;

    } catch (error) {
      console.error("❌ Erro:", error);
      messageDiv.innerHTML = `<p class="error">❌ Erro: ${error.message}</p>`;
    }
  });

  console.log("✅ Script carregado com sucesso");
</script>

</body>
</html>
